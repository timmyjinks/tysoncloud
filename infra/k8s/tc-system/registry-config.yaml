---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-hosts-toml
  namespace: tc-system
  labels:
    app: registry-config
data:
  hosts.toml: |
    server = "http://registry.tc-system.svc.cluster.local:5000"
    [host."http://registry.tc-system.svc.cluster.local:5000"]
      capabilities = ["pull", "resolve", "push"]
      skip_verify = true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-config
  namespace: tc-system
  labels:
    app: registry-config
spec:
  selector:
    matchLabels:
      app: registry-config
  template:
    metadata:
      labels:
        app: registry-config
    spec:
      hostPID: true
      containers:
        - name: configure
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              HOSTS_DIR="/host/etc/containerd/certs.d/registry.tc-system.svc.cluster.local:5000"
              # k3s uses /etc/rancher/k3s/registries.yaml for insecure registries, also support containerd certs.d
              mkdir -p "$HOSTS_DIR"
              cp /config/hosts.toml "$HOSTS_DIR/hosts.toml"
              echo "installed hosts.toml to $HOSTS_DIR"
              # Also ensure k3s registries.yaml allows plain http (idempotent append)
              REGISTRIES_YAML="/host/etc/rancher/k3s/registries.yaml"
              if [ -d "$(dirname "$REGISTRIES_YAML")" ]; then
                if ! grep -q "registry.tc-system.svc.cluster.local:5000" "$REGISTRIES_YAML" 2>/dev/null; then
                  cat >> "$REGISTRIES_YAML" <<'YAML'
              mirrors:
                "registry.tc-system.svc.cluster.local:5000":
                  endpoint:
                    - "http://registry.tc-system.svc.cluster.local:5000"
              configs:
                "registry.tc-system.svc.cluster.local:5000":
                  tls:
                    insecure_skip_verify: true
              YAML
                  echo "appended to $REGISTRIES_YAML"
                fi
              fi
              # Keep pod alive to satisfy DaemonSet; re-sync every 60s in case file is removed
              while true; do sleep 60; cp /config/hosts.toml "$HOSTS_DIR/hosts.toml" || true; done
          volumeMounts:
            - name: host-etc
              mountPath: /host/etc
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            privileged: true
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
        - name: config
          configMap:
            name: registry-hosts-toml
      terminationGracePeriodSeconds: 5
