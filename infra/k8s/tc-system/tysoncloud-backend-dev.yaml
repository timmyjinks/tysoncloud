apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tysoncloud-backend-dev
  namespace: tc-system
spec:
  parentRefs:
    - name: tysoncloud-gateway
      namespace: tc-system
  hostnames:
    - "app-tc-api.tysonjenkins.dev"
    - "app-tysoncloud-api.tysonjenkins.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tysoncloud-backend-dev
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tysoncloud-backend-dev
  namespace: tc-system
  labels:
    app: tysoncloud-backend-dev
spec:
  selector:
    app: tysoncloud-backend-dev
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tysoncloud-backend-dev
  labels:
    app: tysoncloud-backend-dev
  namespace: tc-system
spec:
  selector:
    matchLabels:
      app: tysoncloud-backend-dev
  template:
    metadata:
      labels:
        app: tysoncloud-backend-dev
    spec:
      serviceAccountName: tysoncloud-backend
      containers:
        - name: tysoncloud-backend-dev
          image: timmijinks/tysoncloud-backend-dev
          ports:
            - containerPort: 8080
          env:
            - name: REGISTRY_URL
              value: 10.43.208.127:5000
            - name: BUILDKIT_HOST
              value: tcp://localhost:1234
            - name: REGISTRY_INSECURE
              value: "true"
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  key: ALLOWED_ORIGINS
                  name: tysoncloud-backend-dev
            - name: CLERK_API_KEY
              valueFrom:
                secretKeyRef:
                  key: CLERK_API_KEY
                  name: tysoncloud-backend-dev
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: SUPABASE_URL
                  name: tysoncloud-backend-dev
            - name: SUPABASE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SUPABASE_API_KEY
                  name: tysoncloud-backend-dev
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_WEBHOOK_SECRET
                  name: tysoncloud-backend-dev
            - name: GITHUB_APP_SLUG
              valueFrom: 
                secretKeyRef:
                  key: GITHUB_APP_SLUG
                  name: tysoncloud-backend-dev
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_ID
                  name: tysoncloud-backend-dev
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_PRIVATE_KEY
                  name: tysoncloud-backend-dev
                  optional: true
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_CLIENT_ID
                  name: tysoncloud-backend-dev
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_CLIENT_SECRET
                  name: tysoncloud-backend-dev
                  optional: true
        - name: buildkitd
          # Pinned to match the buildctl client in backend/cmd/deploy/Dockerfile.
          image: moby/buildkit:v0.23.2@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e
          args:
            # Loopback only: the API container shares the pod network
            # namespace, nothing else in the cluster can reach buildkitd.
            - --addr
            - tcp://127.0.0.1:1234
            - --addr
            - unix:///run/buildkit/buildkitd.sock
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "unix:///run/buildkit/buildkitd.sock", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 5Gi
