apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tysoncloud-backend
  namespace: tc-system
spec:
  parentRefs:
    - name: tysoncloud-gateway
      namespace: tc-system
  hostnames:
    - "tc-api.tysonjenkins.dev"
    - "tysoncloud-api.tysonjenkins.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tysoncloud-backend
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tysoncloud-backend
  namespace: tc-system
  labels:
    app: tysoncloud-backend
spec:
  selector:
    app: tysoncloud-backend
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tysoncloud-backend
  labels:
    app: tysoncloud-backend
  namespace: tc-system
spec:
  selector:
    matchLabels:
      app: tysoncloud-backend
  template:
    metadata:
      labels:
        app: tysoncloud-backend
    spec:
      serviceAccountName: tysoncloud-backend
      securityContext:
        fsGroup: 65532
      volumes:
        - name: buildkit-tls
          secret:
            secretName: buildkit-client-tls
            defaultMode: 0440
        - name: registry-auth
          secret:
            secretName: registry-auth
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
      containers:
        - name: tysoncloud-backend
          image: ghcr.io/timmyjinks/tysoncloud-backend:sha-1ec07ad603466e913ed40abb1c106992461b9acc
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: buildkit-tls
              mountPath: /etc/tysoncloud/buildkit-tls
              readOnly: true
            - name: registry-auth
              mountPath: /etc/tysoncloud/registry-auth
              readOnly: true
          env:
            - name: REGISTRY_URL
              value: 10.43.208.127:5000
            - name: BUILDKIT_HOST
              value: tcp://buildkitd.tc-build.svc.cluster.local:1234
            - name: BUILDKIT_TLS_CA_CERT
              value: /etc/tysoncloud/buildkit-tls/ca.crt
            - name: BUILDKIT_TLS_CERT
              value: /etc/tysoncloud/buildkit-tls/tls.crt
            - name: BUILDKIT_TLS_KEY
              value: /etc/tysoncloud/buildkit-tls/tls.key
            - name: BUILDKIT_TLS_SERVER_NAME
              value: buildkitd.tc-build.svc.cluster.local
            - name: REGISTRY_DOCKER_CONFIG
              value: /etc/tysoncloud/registry-auth
            - name: REGISTRY_INSECURE
              value: "true"
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  key: ALLOWED_ORIGINS
                  name: tysoncloud-backend
            - name: CLERK_API_KEY
              valueFrom:
                secretKeyRef:
                  key: CLERK_API_KEY
                  name: tysoncloud-backend
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  key: SUPABASE_URL
                  name: tysoncloud-backend
            - name: SUPABASE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SUPABASE_API_KEY
                  name: tysoncloud-backend
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_WEBHOOK_SECRET
                  name: tysoncloud-backend
            - name: GITHUB_APP_SLUG
              value: tysoncloud
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_ID
                  name: tysoncloud-backend
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_PRIVATE_KEY
                  name: tysoncloud-backend
                  optional: true
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_CLIENT_ID
                  name: tysoncloud-backend
                  optional: true
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: GITHUB_APP_CLIENT_SECRET
                  name: tysoncloud-backend
                  optional: true
